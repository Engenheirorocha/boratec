name: Atualizar oportunidades RadarTec
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar editais reais do PNCP
        run: python scripts/coletar.py
      - name: Publicar base atualizada
        run: |
          git config user.name "RadarTec Bot"
          git config user.email "radartec-bot@users.noreply.github.com"
          git add data/licitacoes.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar feed RadarTec"
            git push
          fi
