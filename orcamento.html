<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamento</title>
<style>body{margin:0;background:#0b1013;color:#f3f6f8;font:16px system-ui}main{max-width:680px;margin:auto;padding:24px}a{color:#31c7ef}fieldset{border:1px solid #39454d;border-radius:12px;margin:20px 0;padding:16px}label{display:block;margin:12px 0}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border-radius:8px;border:1px solid #59656d}input,textarea{display:block;width:100%;margin-top:6px;background:#182127;color:white}button{background:#087eae;color:white;cursor:pointer;margin:6px 0}.item{border-bottom:1px solid #39454d;padding-bottom:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}#status{color:#31c7ef}</style>
<main><a href="./index.html">← Voltar ao BoraTec</a><h1>Orçamento</h1><p>Prepare um PDF com seus dados e sua logomarca.</p><form id="form">
<fieldset><legend>Seus dados</legend><label>Nome ou empresa<input id="empresa" required maxlength="160"></label><label>CPF / CNPJ (opcional)<input id="documento" maxlength="40"></label><label>Telefone / WhatsApp<input id="telefone" maxlength="60"></label><label>E-mail<input id="email" type="email" maxlength="120"></label><label>Logomarca (PNG ou JPG, até 5 MB)<input id="logo" type="file" accept="image/png,image/jpeg"></label></fieldset>
<fieldset><legend>Cliente e orçamento</legend><label>Nome do cliente<input id="cliente" required maxlength="160"></label><label>Endereço / local do serviço<textarea id="endereco" maxlength="500"></textarea></label><div class="cols"><label>Número<input id="numero" maxlength="60"></label><label>Data<input id="data" type="date" required></label></div><label>Validade (dias)<input id="validade" type="number" min="1" max="365" value="7" required></label></fieldset>
<fieldset><legend>Serviços e materiais</legend><div id="itens"></div><button id="adicionar" type="button">Adicionar item</button><p>Total: <strong id="total">R$ 0,00</strong></p></fieldset>
<fieldset><legend>Condições</legend><label>Pagamento<textarea id="pagamento" maxlength="2000" placeholder="Ex.: 50% de entrada e 50% na conclusão"></textarea></label><label>Prazo de execução<textarea id="prazo" maxlength="1000"></textarea></label><label>Observações e garantia<textarea id="observacoes" maxlength="3000"></textarea></label></fieldset>
<button id="gerar" type="submit">Gerar e baixar PDF</button><p id="status" role="status"></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
const byId=id=>document.getElementById(id),brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let logo=null;
const now=new Date();byId('data').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
function rows(){return [...document.querySelectorAll('.item')].map(r=>({description:r.querySelector('.descricao').value,qty:Number(r.querySelector('.quantidade').value),price:Number(r.querySelector('.preco').value)}))}
function total(){byId('total').textContent=brl(rows().reduce((s,r)=>s+r.qty*r.price,0))}
function add(){const r=document.createElement('div');r.className='item';r.innerHTML='<label>Descrição<input class="descricao" required maxlength="500"></label><div class="cols"><label>Quantidade<input class="quantidade" type="number" min="0.01" max="100000" step="0.01" value="1" required></label><label>Valor unitário (R$)<input class="preco" type="number" min="0" max="100000000" step="0.01" value="0" required></label></div><button type="button">Remover item</button>';r.querySelector('button').onclick=()=>{r.remove();total()};r.oninput=total;byId('itens').appendChild(r)}
byId('adicionar').onclick=add;add();
byId('logo').onchange=async e=>{logo=null;const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>5*1024*1024){e.target.value='';byId('status').textContent='Escolha uma imagem PNG ou JPG de até 5 MB.';return}try{const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=data});logo={data,w:img.width,h:img.height};byId('status').textContent='Logomarca carregada.'}catch{e.target.value='';byId('status').textContent='Não foi possível carregar a logomarca.'}};
byId('form').onsubmit=e=>{e.preventDefault();const items=rows();if(!items.length){byId('status').textContent='Adicione pelo menos um item.';return}if(!window.jspdf){byId('status').textContent='A biblioteca de PDF não carregou. Confira a conexão e recarregue a página.';return}
try{const doc=new window.jspdf.jsPDF();let y=20;const val=id=>byId(id).value.trim();
function line(text,size=11){doc.setFontSize(size);const lines=doc.splitTextToSize(String(text),170);for(const l of lines){if(y>275){doc.addPage();y=20}doc.text(l,20,y);y+=size*.45+2}}
if(logo){const w=Math.min(45,45*logo.w/logo.h),h=w*logo.h/logo.w;doc.addImage(logo.data,20,y,w,h);y+=h+8}
line(val('empresa'),18);if(val('documento'))line('CPF/CNPJ: '+val('documento'));if(val('telefone'))line('Telefone: '+val('telefone'));if(val('email'))line('E-mail: '+val('email'));y+=6;
line('ORÇAMENTO'+(val('numero')?' Nº '+val('numero'):''),16);line('Data: '+val('data').split('-').reverse().join('/')+' | Validade: '+val('validade')+' dias');y+=4;line('Cliente: '+val('cliente'));if(val('endereco'))line('Local: '+val('endereco'));y+=6;
items.forEach((r,i)=>{line((i+1)+'. '+r.description,12);line('Quantidade: '+r.qty+' | Unitário: '+brl(r.price)+' | Subtotal: '+brl(r.qty*r.price));y+=3});line('TOTAL: '+brl(items.reduce((s,r)=>s+r.qty*r.price,0)),15);y+=5;
for(const [id,label] of [['pagamento','Pagamento'],['prazo','Prazo de execução'],['observacoes','Observações e garantia']])if(val(id)){line(label,12);line(val(id));y+=4}
const count=doc.getNumberOfPages();for(let p=1;p<=count;p++){doc.setPage(p);doc.setFontSize(9);doc.text('Página '+p+' de '+count,170,290)}
doc.save('Orcamento-'+(val('numero')||val('data')).replace(/[^a-zA-Z0-9_-]/g,'-')+'.pdf');byId('status').textContent='PDF gerado. Confira o download no seu dispositivo.'}catch{byId('status').textContent='Não foi possível gerar o PDF. Tente novamente.'}};
</script></html>
