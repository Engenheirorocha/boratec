<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06182b">
<title>Minha Agenda — BoraTec</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06182b;color:#f5f8fc;font-family:Inter,system-ui,Arial}.app{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:1px solid #ffffff18;background:#ffffff0d;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none}.title{font-size:23px;font-weight:900}.sub{font-size:12px;color:#91a7bd}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.card{background:#0d2947;border:1px solid #ffffff12;border-radius:15px;padding:12px}.card small{color:#91a7bd;font-size:9px}.card strong{display:block;margin-top:5px;font-size:16px}.monthbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.monthbar button,.primary,.secondary{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.monthbar button,.secondary{background:#ffffff10;color:#fff}.primary{background:#1687ff;color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#91a7bd;font-size:9px;padding:5px}.day{min-height:58px;border:1px solid #ffffff10;background:#0d2947;color:#fff;border-radius:11px;padding:7px;cursor:pointer;text-align:left}.day.empty{visibility:hidden}.day.selected{outline:2px solid #1687ff}.day.today{border-color:#ff7900}.day .n{font-weight:900}.day .count{display:block;color:#55e69e;font-size:8px;margin-top:10px}.panel{margin-top:17px;background:#0d2947;border:1px solid #ffffff12;border-radius:16px;padding:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.jobs{display:flex;flex-direction:column;gap:9px;margin-top:12px}.job{background:#081d33;border:1px solid #ffffff10;border-radius:13px;padding:12px}.job-top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:9px;padding:5px 8px;border-radius:20px;background:#ffffff10}.badge.done{color:#55e69e}.muted{color:#91a7bd;font-size:11px}.money{margin-top:7px;font-size:11px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{border:0;border-radius:9px;padding:7px 9px;background:#ffffff10;color:#fff}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.sheet{width:100%;max-width:760px;background:#0b2744;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:9px}.field label{display:block;font-size:10px;color:#91a7bd;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff18;background:#06182b;color:#fff}.full{grid-column:1/-1}.form-actions{display:flex;gap:9px;margin-top:16px}.form-actions button{flex:1}.emptymsg{text-align:center;color:#91a7bd;padding:22px 5px}@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:52px;padding:5px}.day .count{margin-top:7px}}
</style></head><body><main class="app"><div class="top"><a class="back" href="./index.html">‹ Voltar</a><div><div class="title">Minha Agenda</div><div class="sub">Organização e diagnóstico mensal</div></div></div><section class="summary"><div class="card"><small>SERVIÇOS</small><strong id="sumServices">0</strong></div><div class="card"><small>FATURAMENTO</small><strong id="sumRevenue">R$ 0</strong></div><div class="card"><small>GASTOS</small><strong id="sumCost">R$ 0</strong></div><div class="card"><small>LUCRO</small><strong id="sumProfit">R$ 0</strong></div></section><div class="monthbar"><button id="prev">‹</button><strong id="monthLabel"></strong><button id="next">›</button></div><div class="calendar" id="calendar"></div><section class="panel"><div class="panel-head"><div><strong id="dayTitle">Selecione um dia</strong><div class="muted" id="daySummary"></div></div><button class="primary" id="addBtn">+ Adicionar serviço</button></div><div class="jobs" id="jobs"></div></section></main><div class="modal" id="modal"><form class="sheet" id="form"><h3 id="formTitle">Novo serviço</h3><div class="grid"><div class="field"><label>Nome do cliente (opcional)</label><input id="client"></div><div class="field"><label>Tipo de serviço (opcional)</label><input id="service"></div><div class="field full"><label>Endereço (opcional)</label><input id="address"></div><div class="field"><label>Valor do orçamento</label><input id="budget" type="number" min="0" step="0.01"></div><div class="field"><label>Valor cobrado</label><input id="charged" type="number" min="0" step="0.01"></div><div class="field"><label>Valor gasto</label><input id="cost" type="number" min="0" step="0.01"></div><div class="field"><label>Status</label><select id="status"><option value="scheduled">Agendado</option><option value="completed">Realizado</option></select></div></div><div class="form-actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button class="primary">Salvar</button></div></form></div><script>
const SB_URL='https://kgagljuutvlpdeqjgqsj.supabase.co',SB_KEY='sb_publishable_dToKktNJesqf1N_fHs4uUQ_Q3th_tCs';const sb=supabase.createClient(SB_URL,SB_KEY);let user=null,view=new Date(),selected=new Date(),rows=[],editing=null;const $=id=>document.getElementById(id),money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`};
async function boot(){let {data}=await sb.auth.getSession();user=data?.session?.user;if(!user){location.href='./login.html';return}view=new Date();selected=new Date();await load()}
async function load(){let y=view.getFullYear(),m=view.getMonth(),start=`${y}-${String(m+1).padStart(2,'0')}-01`,end=`${y}-${String(m+2).padStart(2,'0')}-01`;if(m===11)end=`${y+1}-01-01`;let {data,error}=await sb.from('agenda_entries').select('*').gte('service_date',start).lt('service_date',end).order('service_date');if(error){alert('Não foi possível carregar a agenda.');return}rows=data||[];render()}
function render(){renderSummary();renderCalendar();renderDay()}
function renderSummary(){let done=rows.filter(r=>r.status==='completed'),rev=done.reduce((s,r)=>s+Number(r.amount_charged||0),0),cost=done.reduce((s,r)=>s+Number(r.amount_spent||0),0);$('sumServices').textContent=done.length;$('sumRevenue').textContent=money(rev);$('sumCost').textContent=money(cost);$('sumProfit').textContent=money(rev-cost)}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth(),names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];$('monthLabel').textContent=`${names[m]} ${y}`;let html=['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join(''),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)html+='<button class="day empty"></button>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),key=iso(dt),count=rows.filter(r=>r.service_date===key).length,cls='day'+(iso(selected)===key?' selected':'')+(iso(new Date())===key?' today':'');html+=`<button class="${cls}" onclick="pick(${d})"><span class="n">${d}</span>${count?`<span class="count">${count} serviço${count>1?'s':''}</span>`:''}</button>`}$('calendar').innerHTML=html}
window.pick=d=>{selected=new Date(view.getFullYear(),view.getMonth(),d);renderCalendar();renderDay()};
function renderDay(){let key=iso(selected),list=rows.filter(r=>r.service_date===key);$('dayTitle').textContent=selected.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});let done=list.filter(r=>r.status==='completed'),rev=done.reduce((s,r)=>s+Number(r.amount_charged||0),0),cost=done.reduce((s,r)=>s+Number(r.amount_spent||0),0);$('daySummary').textContent=`Entrou ${money(rev)} • Gastos ${money(cost)} • Lucro ${money(rev-cost)}`;$('jobs').innerHTML=list.length?list.map(r=>`<article class="job"><div class="job-top"><div><strong>${esc(r.client_name||r.service_type||'Serviço')}</strong><div class="muted">${esc(r.service_type||'Sem tipo informado')}</div></div><span class="badge ${r.status==='completed'?'done':''}">${r.status==='completed'?'Realizado':'Agendado'}</span></div>${r.address?`<div class="muted">${esc(r.address)}</div>`:''}<div class="money">Cobrado: ${money(r.amount_charged)} • Gasto: ${money(r.amount_spent)}</div><div class="actions"><button onclick="editEntry('${r.id}')">Editar</button><button onclick="removeEntry('${r.id}')">Excluir</button></div></article>`).join(''):'<div class="emptymsg">Nenhum serviço neste dia.</div>'}
function esc(v){let d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
$('prev').onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=new Date(view);await load()};$('next').onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=new Date(view);await load()};$('addBtn').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};
function openForm(r=null){editing=r?.id||null;$('formTitle').textContent=r?'Editar serviço':'Novo serviço';$('client').value=r?.client_name||'';$('service').value=r?.service_type||'';$('address').value=r?.address||'';$('budget').value=r?.budget_amount||'';$('charged').value=r?.amount_charged||'';$('cost').value=r?.amount_spent||'';$('status').value=r?.status||'scheduled';$('modal').classList.add('open')}
function closeForm(){$('modal').classList.remove('open');editing=null}
window.editEntry=id=>{let r=rows.find(x=>x.id===id);if(r)openForm(r)};
window.removeEntry=async id=>{if(!confirm('Excluir este serviço?'))return;let {error}=await sb.from('agenda_entries').delete().eq('id',id);if(error){alert('Não foi possível excluir.');return}await load()};
$('form').onsubmit=async e=>{e.preventDefault();let payload={user_id:user.id,service_date:iso(selected),client_name:$('client').value.trim()||null,address:$('address').value.trim()||null,service_type:$('service').value.trim()||null,budget_amount:Number($('budget').value)||0,amount_charged:Number($('charged').value)||0,amount_spent:Number($('cost').value)||0,status:$('status').value};let q=editing?sb.from('agenda_entries').update(payload).eq('id',editing):sb.from('agenda_entries').insert(payload),{error}=await q;if(error){alert('Não foi possível salvar o serviço.');return}closeForm();await load()};boot();
</script></body></html>
