<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d10"><title>Minha Agenda — BoraTec</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#090d10;color:#f3f6f8;font-family:Inter,system-ui,Arial}.app{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:1px solid #3d4850;background:#12191e;color:#fff;border-radius:10px;padding:10px 13px;text-decoration:none}.title{font-size:23px;font-weight:900}.sub,.muted{color:#8f9ba3;font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.card,.panel{background:#12191e;border:1px solid #303a42;border-radius:12px;padding:12px}.card small{color:#8f9ba3;font-size:9px}.card strong{display:block;margin-top:5px}.monthbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.monthbar button,.btn{border:1px solid #39444c;border-radius:9px;padding:10px 13px;font-weight:800;background:#171e23;color:#fff}.btn.primary{background:#087eae;border-color:#08baf0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#8f9ba3;font-size:9px;padding:5px}.day{min-height:58px;border:1px solid #303a42;background:#12191e;color:#fff;border-radius:9px;padding:7px;text-align:left}.day.empty{visibility:hidden}.day.selected{outline:2px solid #08baf0}.day.today{border-color:#08baf0}.count{display:block;color:#5dd39a;font-size:8px;margin-top:9px}.panel{margin-top:16px}.panel-head,.job-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.jobs{display:flex;flex-direction:column;gap:9px;margin-top:12px}.job{background:#0e1418;border:1px solid #303a42;border-radius:10px;padding:12px}.badge{font-size:9px;padding:5px 8px;border-radius:20px;background:#182127}.badge.done{color:#5dd39a}.actions{display:flex;gap:7px;margin-top:9px}.actions button{border:1px solid #303a42;border-radius:8px;padding:7px 9px;background:#182127;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:760px;background:#12191e;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:9px}.field label{display:block;font-size:10px;color:#8f9ba3;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border-radius:9px;border:1px solid #39444c;background:#090d10;color:#fff}.full{grid-column:1/-1}.form-actions{display:flex;gap:9px;margin-top:16px}.form-actions button{flex:1}.emptymsg{text-align:center;color:#8f9ba3;padding:22px 5px}@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:52px;padding:5px}}</style></head><body><main class="app"><div class="top"><a class="back" href="./index.html">‹ Voltar</a><div><div class="title">Minha Agenda</div><div class="sub">Organização e diagnóstico mensal</div></div></div><section class="summary"><div class="card"><small>SERVIÇOS REALIZADOS</small><strong id="sumServices">0</strong></div><div class="card"><small>FATURAMENTO</small><strong id="sumRevenue">R$ 0</strong></div><div class="card"><small>GASTOS</small><strong id="sumCost">R$ 0</strong></div><div class="card"><small>LUCRO</small><strong id="sumProfit">R$ 0</strong></div></section><div class="monthbar"><button id="prev">‹</button><strong id="monthLabel"></strong><button id="next">›</button></div><div class="calendar" id="calendar"></div><section class="panel"><div class="panel-head"><div><strong id="dayTitle"></strong><div class="muted" id="daySummary"></div></div><button class="btn primary" id="addBtn">+ Serviço</button></div><div class="jobs" id="jobs"></div></section></main><div class="modal" id="modal"><form class="sheet" id="form"><h3 id="formTitle">Novo serviço</h3><div class="grid"><div class="field"><label>Nome do cliente (opcional)</label><input id="client"></div><div class="field"><label>Tipo de serviço (opcional)</label><input id="service"></div><div class="field full"><label>Endereço (opcional)</label><input id="address"></div><div class="field"><label>Valor do orçamento</label><input id="quoted" type="number" min="0" step="0.01"></div><div class="field"><label>Valor cobrado</label><input id="charged" type="number" min="0" step="0.01"></div><div class="field"><label>Valor gasto</label><input id="cost" type="number" min="0" step="0.01"></div><div class="field"><label>Status</label><select id="status"><option value="scheduled">Agendado</option><option value="completed">Realizado</option></select></div></div><div class="form-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form></div><script>const URL='https://kgagljuutvlpdeqjgqsj.supabase.co',KEY='sb_publishable_dToKktNJesqf1N_fHs4uUQ_Q3th_tCs',sb=supabase.createClient(URL,KEY);let user,view=new Date(),selected=new Date(),rows=[],editing=null;const $=x=>document.getElementById(x),money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,esc=v=>{let x=document.createElement('div');x.textContent=v??'';return x.innerHTML};async function boot(){let {data}=await sb.auth.getSession();user=data?.session?.user;if(!user)return location.href='./login.html';await load()}async function load(){let y=view.getFullYear(),m=view.getMonth(),start=`${y}-${String(m+1).padStart(2,'0')}-01`,ny=m===11?y+1:y,nm=m===11?1:m+2,end=`${ny}-${String(nm).padStart(2,'0')}-01`;let {data,error}=await sb.from('technician_agenda_entries').select('*').gte('service_date',start).lt('service_date',end).order('service_date');if(error)return alert('Não foi possível carregar a agenda.');rows=data||[];render()}function render(){summary();calendar();day()}function summary(){let d=rows.filter(x=>x.status==='completed'),r=d.reduce((s,x)=>s+(+x.charged_value||0),0),c=d.reduce((s,x)=>s+(+x.cost_value||0),0);$('sumServices').textContent=d.length;$('sumRevenue').textContent=money(r);$('sumCost').textContent=money(c);$('sumProfit').textContent=money(r-c)}function calendar(){let y=view.getFullYear(),m=view.getMonth(),names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];$('monthLabel').textContent=`${names[m]} ${y}`;let h=['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join(''),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)h+='<button class="day empty"></button>';for(let n=1;n<=days;n++){let d=new Date(y,m,n),k=dateKey(d),count=rows.filter(x=>x.service_date===k).length,cl='day'+(dateKey(selected)===k?' selected':'')+(dateKey(new Date())===k?' today':'');h+=`<button class="${cl}" onclick="pick(${n})"><b>${n}</b>${count?`<span class="count">${count} serviço${count>1?'s':''}</span>`:''}</button>`}$('calendar').innerHTML=h}window.pick=n=>{selected=new Date(view.getFullYear(),view.getMonth(),n);calendar();day()};function day(){let list=rows.filter(x=>x.service_date===dateKey(selected)),done=list.filter(x=>x.status==='completed'),r=done.reduce((s,x)=>s+(+x.charged_value||0),0),c=done.reduce((s,x)=>s+(+x.cost_value||0),0);$('dayTitle').textContent=selected.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});$('daySummary').textContent=`Entrou ${money(r)} • Gastos ${money(c)} • Lucro ${money(r-c)}`;$('jobs').innerHTML=list.length?list.map(x=>`<article class="job"><div class="job-top"><div><strong>${esc(x.client_name||x.service_type||'Serviço')}</strong><div class="muted">${esc(x.service_type||'Sem tipo informado')}</div></div><span class="badge ${x.status==='completed'?'done':''}">${x.status==='completed'?'Realizado':'Agendado'}</span></div>${x.client_address?`<div class="muted">${esc(x.client_address)}</div>`:''}<div class="muted">Orçamento ${money(x.quoted_value)} • Cobrado ${money(x.charged_value)} • Gasto ${money(x.cost_value)}</div><div class="actions"><button onclick="editEntry('${x.id}')">Editar</button><button onclick="removeEntry('${x.id}')">Excluir</button></div></article>`).join(''):'<div class="emptymsg">Nenhum serviço neste dia.</div>'}function openForm(x=null){editing=x?.id||null;$('formTitle').textContent=x?'Editar serviço':'Novo serviço';$('client').value=x?.client_name||'';$('service').value=x?.service_type||'';$('address').value=x?.client_address||'';$('quoted').value=x?.quoted_value||'';$('charged').value=x?.charged_value||'';$('cost').value=x?.cost_value||'';$('status').value=x?.status||'scheduled';$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open');editing=null}window.editEntry=id=>openForm(rows.find(x=>x.id===id));window.removeEntry=async id=>{if(!confirm('Excluir este serviço?'))return;let {error}=await sb.from('technician_agenda_entries').delete().eq('id',id);if(error)return alert('Não foi possível excluir.');await load()};$('form').onsubmit=async e=>{e.preventDefault();let p={user_id:user.id,service_date:dateKey(selected),client_name:$('client').value.trim()||null,client_address:$('address').value.trim()||null,service_type:$('service').value.trim()||null,quoted_value:+$('quoted').value||0,charged_value:+$('charged').value||0,cost_value:+$('cost').value||0,status:$('status').value,updated_at:new Date().toISOString()},q=editing?sb.from('technician_agenda_entries').update(p).eq('id',editing):sb.from('technician_agenda_entries').insert(p),{error}=await q;if(error)return alert('Não foi possível salvar.');closeForm();await load()};$('prev').onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=new Date(view);await load()};$('next').onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=new Date(view);await load()};$('addBtn').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};boot();</script></body></html>
