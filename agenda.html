<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06182b">
<title>Agenda e resultados — BoraTec</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06182b;color:#f4f8fc;font:15px system-ui,Arial,sans-serif}.shell{max-width:760px;margin:auto;padding:18px 14px 90px}.top,.monthbar,.panelhead,.jobhead,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{justify-content:flex-start}.back,.secondary,.monthbar button,.actions button{border:1px solid #ffffff22;background:#102d49;color:#fff;border-radius:10px;padding:10px;text-decoration:none;cursor:pointer}.back{font-size:21px}h1{font-size:24px;margin:0}.muted{color:#a5b8cb;font-size:12px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:19px 0}.card,.panel,.job{background:#0e2b48;border:1px solid #ffffff16;border-radius:15px;padding:14px}.card small{display:block;color:#a5b8cb;font-size:11px}.card strong{display:block;margin-top:5px;font-size:19px}.monthbar{margin:18px 0}.monthbar button{font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:#a5b8cb;font-size:11px}.day{min-height:64px;border:1px solid #ffffff20;background:#0e2b48;border-radius:10px;color:#fff;text-align:left;padding:7px 5px;cursor:pointer}.day[aria-pressed=true]{outline:2px solid #22a8f8}.day.today{border-color:#e48b3f}.day small{display:block;color:#8be8c7;font-size:10px;margin-top:6px}.blank{visibility:hidden}.panel{margin-top:18px}.jobs{display:grid;gap:9px;margin-top:12px}.job{background:#09223b}.jobhead{align-items:flex-start}.job p{margin:7px 0}.badge{font-size:11px;color:#b8d5e9}.primary{border:0;background:#1687e4;color:#fff;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.actions{justify-content:flex-start;margin-top:10px}button:disabled{opacity:.55;cursor:wait}.error{color:#ffadad;min-height:1em}.sheetback{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}.sheetback.open{display:flex}.sheet{background:#0d2b49;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:760px;max-height:94vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;margin-bottom:5px;color:#c2d6e7;font-size:12px}.field input,.field select{width:100%;border:1px solid #ffffff30;border-radius:9px;background:#06182b;color:#fff;padding:11px;font:inherit}.full{grid-column:1/-1}.formactions{display:flex;gap:9px;margin-top:16px}.formactions button{flex:1}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:53px}.panelhead{align-items:flex-start}.panelhead .primary{max-width:150px}.card strong{font-size:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="shell">
 <header class="top"><a class="back" href="./index.html" aria-label="Voltar à Home">‹</a><div><h1>Agenda e resultados</h1><div class="muted">Seus atendimentos e o resultado do mês</div></div></header>
 <p id="message" class="error" role="alert"></p>
 <section class="summary" aria-label="Resumo do mês"><div class="card"><small>REALIZADOS</small><strong id="sumCount">0</strong></div><div class="card"><small>RECEBIDO</small><strong id="sumReceived">R$ 0,00</strong></div><div class="card"><small>GASTOS</small><strong id="sumCost">R$ 0,00</strong></div><div class="card"><small>RESULTADO</small><strong id="sumResult">R$ 0,00</strong></div></section>
 <div class="monthbar"><button id="prev" type="button" aria-label="Mês anterior">‹</button><strong id="month"></strong><button id="next" type="button" aria-label="Próximo mês">›</button></div>
 <div id="calendar" class="calendar" aria-label="Calendário de serviços"></div>
 <section class="panel"><div class="panelhead"><div><strong id="dayTitle"></strong><div id="dayTotal" class="muted"></div></div><button id="add" class="primary" type="button">+ Adicionar serviço</button></div><div id="jobs" class="jobs"></div></section>
</main>
<div id="modal" class="sheetback"><form id="form" class="sheet"><h2 id="formTitle">Novo serviço</h2><div class="grid">
 <div class="field"><label for="client">Nome do cliente</label><input id="client" maxlength="150" autocomplete="name"></div>
 <div class="field"><label for="type">Tipo de serviço</label><input id="type" maxlength="200"></div>
 <div class="field full"><label for="address">Endereço do cliente</label><input id="address" maxlength="300" autocomplete="street-address"></div>
 <div class="field"><label for="quote">Valor do orçamento (R$)</label><input id="quote" type="number" min="0" max="99999999" step="0.01" inputmode="decimal"></div>
 <div class="field"><label for="received">Valor recebido (R$)</label><input id="received" type="number" min="0" max="99999999" step="0.01" inputmode="decimal"></div>
 <div class="field"><label for="cost">Gastos (R$)</label><input id="cost" type="number" min="0" max="99999999" step="0.01" inputmode="decimal"></div>
 <div class="field"><label for="status">Situação</label><select id="status"><option value="scheduled">Agendado</option><option value="completed">Realizado</option></select></div>
 </div><p class="muted">O resultado é o valor recebido menos os gastos, nos serviços realizados. Uma visita agendada ainda não entra nos totais.</p><p id="formError" class="error" role="alert"></p><div class="formactions"><button type="button" id="cancel" class="secondary">Cancelar</button><button type="submit" id="save" class="primary">Salvar</button></div></form></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const db = window.supabase.createClient('https://kgagljuutvlpdeqjgqsj.supabase.co','sb_publishable_dToKktNJesqf1N_fHs4uUQ_Q3th_tCs');
const TABLE = 'technician_agenda_entries';
const money = n => Number(n || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let user, view = new Date(), selected = new Date(), entries = [], editing = null;
function message(value){$('message').textContent=value || ''}
function errorText(error){console.error('Agenda:',error);return 'Não foi possível concluir. Confira a conexão e tente novamente.'}
async function boot(){try{const {data,error}=await db.auth.getUser();if(error || !data.user){location.replace('./login.html');return}user=data.user;await load()}catch(error){message(errorText(error))}}
async function load(){const start=dateKey(new Date(view.getFullYear(),view.getMonth(),1));const end=dateKey(new Date(view.getFullYear(),view.getMonth()+1,1));message('');const {data,error}=await db.from(TABLE).select('id,user_id,service_date,client_name,client_address,service_type,quoted_value,charged_value,cost_value,status').eq('user_id',user.id).gte('service_date',start).lt('service_date',end).order('service_date');if(error){message(errorText(error));return}entries=data || [];render()}
function totals(list){const done=list.filter(e=>e.status==='completed');const received=done.reduce((n,e)=>n+Math.round(Number(e.charged_value)*100),0)/100;const cost=done.reduce((n,e)=>n+Math.round(Number(e.cost_value)*100),0)/100;return {count:done.length,received,cost,result:received-cost}}
function render(){const t=totals(entries);$('sumCount').textContent=t.count;$('sumReceived').textContent=money(t.received);$('sumCost').textContent=money(t.cost);$('sumResult').textContent=money(t.result);$('month').textContent=view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});renderCalendar();renderDay()}
function renderCalendar(){const box=$('calendar');box.replaceChildren();for(const day of ['D','S','T','Q','Q','S','S']){const el=document.createElement('div');el.className='dow';el.textContent=day;box.append(el)}const year=view.getFullYear(),month=view.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++){const blank=document.createElement('span');blank.className='blank';box.append(blank)}for(let i=1;i<=count;i++){const key=dateKey(new Date(year,month,i)),services=entries.filter(e=>e.service_date===key).length;const button=document.createElement('button');button.className='day'+(key===dateKey(new Date())?' today':'');button.type='button';button.setAttribute('aria-pressed',String(key===dateKey(selected)));button.setAttribute('aria-label',`${i} de ${$('month').textContent}, ${services} serviços`);const number=document.createElement('strong');number.textContent=i;button.append(number);if(services){const small=document.createElement('small');small.textContent=`${services} serviço${services===1?'':'s'}`;button.append(small)}button.addEventListener('click',()=>{selected=new Date(year,month,i);renderCalendar();renderDay()});box.append(button)}}
function renderDay(){const list=entries.filter(e=>e.service_date===dateKey(selected)),t=totals(list);$('dayTitle').textContent=selected.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('dayTotal').textContent=`${list.length} atendimento${list.length===1?'':'s'} • Recebido ${money(t.received)} • Gastos ${money(t.cost)} • Resultado ${money(t.result)}`;const box=$('jobs');box.replaceChildren();if(!list.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='Nenhum serviço neste dia.';box.append(empty)}for(const entry of list){const article=document.createElement('article');article.className='job';const head=document.createElement('div');head.className='jobhead';const title=document.createElement('strong');title.textContent=entry.client_name || entry.service_type || 'Atendimento';const badge=document.createElement('span');badge.className='badge';badge.textContent=entry.status==='completed'?'Realizado':'Agendado';head.append(title,badge);article.append(head);for(const detail of [entry.service_type,entry.client_address]){if(detail){const p=document.createElement('p');p.className='muted';p.textContent=detail;article.append(p)}}const values=document.createElement('p');values.textContent=`Orçamento ${money(entry.quoted_value)} • Recebido ${money(entry.charged_value)} • Gastos ${money(entry.cost_value)}`;article.append(values);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.textContent='Editar';edit.addEventListener('click',()=>openForm(entry));const remove=document.createElement('button');remove.type='button';remove.textContent='Excluir';remove.addEventListener('click',()=>removeEntry(entry));actions.append(edit,remove);article.append(actions);box.append(article)}}
function openForm(entry=null){editing=entry?.id || null;$('formTitle').textContent=entry?'Editar serviço':'Novo serviço';$('client').value=entry?.client_name || '';$('type').value=entry?.service_type || '';$('address').value=entry?.client_address || '';$('quote').value=entry?.quoted_value ?? '';$('received').value=entry?.charged_value ?? '';$('cost').value=entry?.cost_value ?? '';$('status').value=entry?.status || 'scheduled';$('formError').textContent='';$('modal').classList.add('open');$('client').focus()}
function closeForm(){$('modal').classList.remove('open');editing=null}
function amount(id){const raw=$(id).value.trim();if(!raw)return 0;const n=Number(raw);if(!Number.isFinite(n)||n<0||n>99999999||Math.abs(Math.round(n*100)-n*100)>0.000001)throw new Error('Informe valores válidos, com até duas casas decimais.');return n}
async function save(event){event.preventDefault();const button=$('save');if(button.disabled)return;let payload;try{payload={user_id:user.id,service_date:dateKey(selected),client_name:$('client').value.trim() || null,client_address:$('address').value.trim() || null,service_type:$('type').value.trim() || null,quoted_value:amount('quote'),charged_value:amount('received'),cost_value:amount('cost'),status:$('status').value};if(payload.status==='scheduled' && payload.charged_value>0)throw new Error('Marque como realizado para registrar um valor recebido.')}catch(error){$('formError').textContent=error.message;return}button.disabled=true;const query=editing?db.from(TABLE).update(payload).eq('id',editing).eq('user_id',user.id):db.from(TABLE).insert(payload);try{const {error}=await query;if(error)throw error;closeForm();await load()}catch(error){$('formError').textContent=errorText(error)}finally{button.disabled=false}}
async function removeEntry(entry){if(!confirm('Excluir este serviço da agenda?'))return;const {error}=await db.from(TABLE).delete().eq('id',entry.id).eq('user_id',user.id);if(error){message(errorText(error));return}await load()}
$('prev').addEventListener('click',async()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=new Date(view);await load()});$('next').addEventListener('click',async()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=new Date(view);await load()});$('add').addEventListener('click',()=>openForm());$('cancel').addEventListener('click',closeForm);$('modal').addEventListener('click',event=>{if(event.target===$('modal'))closeForm()});$('form').addEventListener('submit',save);boot();
</script>
</body>
</html>
